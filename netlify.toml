# Netlify build + functions configuration.
# Build settings mirror package.json (vite build → dist).
# The serverless function lives in netlify/functions and is exposed at
# /api/sendReport via the function's own `config.path` export (Netlify
# Functions v2), so no manual redirect rule is required here.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  # .mjs functions are ESM; Netlify Functions v2 runtime.
  node_bundler = "esbuild"

# ── SPA client-side routing fallback ──
# The app is a single-page app. Client routes (e.g. /leaderboard-embed)
# have no real file on disk, so unmatched paths must fall back to
# index.html. Real static assets (/assets/*) and the /api/* function
# routes are resolved first, so this catch-all only affects SPA routes.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Allow the public embed route to be framed by external sites ──
# /leaderboard-embed is a public, read-only widget meant to be embedded
# via <iframe>. `frame-ancestors *` permits any site to embed it; to
# restrict it, replace * with your site, e.g. "https://yourdomain.com".
# No X-Frame-Options is set anywhere, so framing is not otherwise blocked.
[[headers]]
  for = "/leaderboard-embed"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"

# ── Private admin stats page — never index, never cache ──
# Token-gated all-time stats lives at /admin/<TOKEN>. These headers keep
# search engines out of the page (even if the URL ever leaks) and prevent
# any CDN / browser caching of the response. The API endpoint also sends
# `Cache-Control: no-store` in its own response.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "no-store"
